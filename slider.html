<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Animation</title>

    <style>
        .parent-slider{
            width: 90%;
            height: 300px;
            background-color: antiquewhite;
            margin: 100px auto;
            overflow: hidden;
        }

        .slider{
            width: 200%;
            height: 100%;
            border: 2px solid red;

            animation-name: slides;
            animation-duration: 10s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes slides {
            from{
                margin-left: 0;
            }

            to{
                margin-left: -100%;
            }
            
        }

        .slides{
            width: 15%;
            height: 100%;
            display: inline-block;
            vertical-align: top;
            margin-left: 30px;
            background-color: aqua;
        }
    </style>
</head>
<body>
    

    <div class="parent-slider">
        <div class="slider">
            <div class="slides"></div>
            <div class="slides"></div>
            <div class="slides"></div>
            <div class="slides"></div>
            <div class="slides"></div>
            <div class="slides"></div>
        </div>
    </div>
</body>
</html>
